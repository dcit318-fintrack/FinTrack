name: Deploy Client to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Blazor WASM → Netlify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/FinTrack.Client/FinTrack.Client.csproj

      - name: Publish Blazor WASM client
        run: |
          dotnet publish src/FinTrack.Client/FinTrack.Client.csproj \
            --configuration Release \
            --output ./publish/client
          if [ ! -f ./publish/client/wwwroot/_framework/blazor.webassembly.js ]; then
            cp ./publish/client/wwwroot/_framework/blazor.webassembly.*.js ./publish/client/wwwroot/_framework/blazor.webassembly.js 2>/dev/null || true
          fi

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=./publish/client/wwwroot --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
